<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>reading design: from print to screen</title>
<style>
:root{font-family:"Courier New",monospace;font-size:14px;line-height:1.5;color:#111;background:#fff;--green:#00b96b}*{box-sizing:border-box}body{margin:0;padding:36px 24px}button,a{font:inherit}button{border:0;background:none;color:inherit;cursor:pointer;padding:0}button:hover,a:hover{color:var(--green)}button:focus-visible,a:focus-visible{outline:1px solid var(--green);outline-offset:6px}header{text-align:center}h1{font-size:inherit;font-weight:normal;margin:0 0 22px}.intro{max-width:700px;margin:0 auto 24px;text-align:left;padding-left:24px}.filters{display:flex;justify-content:center;gap:12px 24px;flex-wrap:wrap}.filters button[aria-pressed="true"]{color:var(--green)}.hint{text-align:center;color:#888;font-size:12px;margin:26px 0 0}.diagram{position:relative;max-width:1000px;height:680px;margin:0 auto}.connections{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;overflow:visible}.connections line{stroke:var(--green);stroke-width:1;stroke-dasharray:4 6}.word{position:absolute;transform:translate(-50%,-50%);z-index:2;white-space:nowrap;background:white;padding:4px 8px}.word.keyword{color:#777;font-size:12px}.word.active{color:var(--green)}.word.dim{opacity:.22}.preview{position:absolute;z-index:5;width:460px;max-width:calc(100% - 24px);background:rgba(255,255,255,.97);padding:18px;border:1px solid #eee;box-shadow:0 8px 30px #00000008}.preview[hidden]{display:none}.preview-heading{display:flex;justify-content:space-between;gap:20px;margin-bottom:16px;color:var(--green)}.cards{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:22px 18px;max-height:290px;overflow:auto}.card{display:block;text-decoration:none;color:inherit;font-size:12px}.card img{display:block;width:100%;height:125px;object-fit:contain;margin-bottom:9px}.card .text-image{display:flex;align-items:center;justify-content:center;height:125px;background:#f5f5f5;margin-bottom:9px}.card-title{display:block;overflow-wrap:anywhere}.card-terms{display:block;margin-top:6px;color:#888;font-size:11px}.card:hover .card-terms{color:var(--green)}.card:hover{color:var(--green)}.through{display:block;width:80px;height:80px;margin:4px auto;animation:spin 8s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}@media(prefers-reduced-motion:reduce){.through{animation:none}}@media(max-width:600px){body{padding:26px 14px}.diagram{height:850px}.word{font-size:12px;padding:3px}.preview{width:320px}.cards{max-height:230px}.card img,.card .text-image{height:95px}.hint{max-width:280px;margin:24px auto}.filters{gap:10px 16px}}

/* Keep the diagram and its work preview in separate columns. */
.diagram{max-width:1200px;height:720px;padding-right:460px}
.connections{width:calc(100% - 460px)}
.word{font-size:16px}
.word.keyword{font-size:12px;color:#888}
.preview{left:auto!important;right:0;top:30px!important;width:420px;max-width:420px;border:0;border-left:1px solid #eee;box-shadow:none;padding:0 0 0 28px;background:#fff}
.cards{max-height:600px}
@media(max-width:800px){
 .diagram{height:1000px;padding-right:0}
 .connections{width:100%;height:580px}
 .word{font-size:14px}
 .word.keyword{font-size:11px}
 .preview{top:620px!important;right:0;left:0!important;width:100%;max-width:100%;padding:20px 0 0;border-left:0;border-top:1px solid #eee}
 .cards{max-height:330px}
}
</style>
</head>
<body>
<header>
<h1><button id="title" aria-expanded="false" aria-controls="introduction">reading design: from print to screen</button></h1>
<div id="introduction" class="intro" hidden>I like design that lets me understand how it was built. This archive explores how a design works, how it was built, and what decisions shaped it.<img class="through" src="through.svg" alt="through:"></div>

</header>
<p class="hint">hover a category or keyword to discover works · hover a work to trace its connections</p>
<main class="diagram" aria-label="Design reading connections">
<svg class="connections" aria-hidden="true"></svg>
<aside class="preview" hidden aria-label="Related works"><div class="preview-heading"><span></span><button aria-label="Close preview">×</button></div><div class="cards"></div></aside>
</main>
<script src="archive-data.js"></script><script src="archive.js"></script>
</body></html>
